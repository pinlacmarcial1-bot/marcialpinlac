<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Family - Portfolio Section</title>
    <!-- Google Fonts for formal typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b1a20;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .family-container {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(145deg, #102730 0%, #061116 100%);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        /* Ambient background glow */
        .family-container::before {
            content: '';
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
        }

        /* Upper Middle Header */
        .family-header {
            text-align: center;
            margin-bottom: 45px;
            position: relative;
        }

        .family-header .sub-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #38bdf8;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .family-header h2 {
            font-family: 'Cinzel', serif;
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #ffffff;
            text-transform: uppercase;
            display: inline-block;
            position: relative;
            padding-bottom: 12px;
        }

        .family-header h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #38bdf8, transparent);
            border-radius: 2px;
        }

        .family-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .family-card {
            flex: 1;
            min-width: 280px;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .family-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5),
                        0 0 20px rgba(56, 189, 248, 0.15);
        }

        /* Fixed image framing for exact equal dimensions */
        .photo-wrapper {
            width: 100%;
            height: 320px; /* Locked identical height */
            border-radius: 12px;
            overflow: hidden;
            background-color: #050d11;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Auto-crop to equalize photo dimensions */
            object-position: center;
            display: block;
            transition: transform 0.5s ease;
        }

        .family-card:hover .photo-wrapper img {
            transform: scale(1.03);
        }

        .card-caption {
            margin-top: 18px;
            text-align: center;
        }

        .card-caption h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #f8fafc;
            letter-spacing: 0.5px;
        }

        .card-caption span {
            display: block;
            font-size: 0.85rem;
            color: #38bdf8;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
        }

        /* Mobile Responsive View */
        @media (max-width: 680px) {
            .family-container {
                padding: 35px 20px;
            }

            .family-header h2 {
                font-size: 1.8rem;
            }

            .photo-wrapper {
                height: 260px;
            }
        }
    </style>
</head>
<body>

    <div class="family-container">
        <!-- Upper Middle Header -->
        <div class="family-header">
            <div class="sub-title">Personal Portfolio</div>
            <h2>MY FAMILY</h2>
        </div>

        <!-- Equal Size Cards Grid -->
        <div class="family-grid">
            <!-- Papa's Box -->
            <div class="family-card">
                <div class="photo-wrapper">
                    <img src="papa.jpg" alt="Me with Papa">
                </div>
                <div class="card-caption">
                    <h3>Father & Son</h3>
                    <span>With My Papa</span>
                </div>
            </div>

            <!-- Mama's Box -->
            <div class="family-card">
                <div class="photo-wrapper">
                    <img src="mama.jpg" alt="Me with Mama">
                </div>
                <div class="card-caption">
                    <h3>Mother & Son</h3>
                    <span>With My Mama</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>

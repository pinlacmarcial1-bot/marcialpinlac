<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Family and Friends - Portfolio Section</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts for formal typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b1a20;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .family-container {
            width: 100%;
            max-width: 1000px;
            max-height: calc(100vh - 88px);
            background: linear-gradient(145deg, #102730 0%, #061116 100%);
            border: 1px solid rgba(56, 189, 248, 0.28);
            border-radius: 20px;
            padding: 20px 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Ambient background glow */
        .family-container::before {
            content: '';
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
        }

        /* Upper Middle Header */
        .family-header {
            text-align: center;
            margin-bottom: 14px;
            position: relative;
        }

        .family-header .sub-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3.5px;
            color: #38bdf8;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .family-header h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: #ffffff;
            text-transform: uppercase;
            display: inline-block;
            position: relative;
            padding-bottom: 6px;
        }

        .family-header h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 85px;
            height: 2.5px;
            background: linear-gradient(90deg, transparent, #38bdf8, transparent);
            border-radius: 2px;
        }

        .family-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            flex: 1;
            min-height: 0;
        }

        .family-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(56, 189, 248, 0.18);
            border-radius: 14px;
            padding: 10px 12px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 0;
        }

        .family-card:hover {
            transform: translateY(-3px);
            background: rgba(56, 189, 248, 0.06);
            border-color: rgba(56, 189, 248, 0.65);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.45),
                        0 0 18px rgba(56, 189, 248, 0.2);
        }

        /* Highlight badge on top-left of photo */
        .role-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 2;
            background: rgba(6, 17, 22, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.6);
            color: #7dd3fc;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 2px 8px;
            border-radius: 999px;
            backdrop-filter: blur(4px);
        }

        /* Compact image framing to fit 2x2 grid on one screen */
        .photo-wrapper {
            width: 100%;
            flex: 1;
            min-height: 115px;
            max-height: 175px;
            border-radius: 10px;
            overflow: hidden;
            background-color: #050d11;
            border: 1px solid rgba(255, 255, 255, 0.12);
            position: relative;
        }

        .photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
            transition: transform 0.4s ease;
        }

        .family-card:hover .photo-wrapper img {
            transform: scale(1.03);
        }

        .card-caption {
            margin-top: 8px;
            text-align: center;
            flex-shrink: 0;
        }

        .card-caption h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.4px;
            line-height: 1.2;
        }

        .card-caption span {
            display: inline-block;
            font-size: 0.72rem;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            padding: 2px 10px;
            border-radius: 999px;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
            line-height: 1.2;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center px-4 py-3 relative">

    <!-- NAVIGATION MENU -->
    <nav class="w-full max-w-[1000px] flex justify-end gap-2 font-semibold mb-3 z-20 shrink-0 text-sm">
        <a href="index.html" class="px-3.5 py-1.5 rounded-lg bg-slate-800 text-teal-300 hover:bg-teal-700 hover:text-white transition-all">
            Home
        </a>
        <a href="about.html" class="px-3.5 py-1.5 rounded-lg bg-slate-800 text-teal-300 hover:bg-teal-700 hover:text-white transition-all">
            Personal Information
        </a>
        <a href="achievements.html" class="px-3.5 py-1.5 rounded-lg bg-slate-800 text-teal-300 hover:bg-teal-700 hover:text-white transition-all">
            Achievements
        </a>
        <a href="family.html" class="px-3.5 py-1.5 rounded-lg bg-sky-500 text-slate-900 border border-sky-300 font-bold">
            Family and Friends
        </a>
    </nav>

    <!-- FAMILY CONTAINER -->
    <div class="family-container">
        <!-- Upper Middle Header -->
        <div class="family-header">
            <div class="sub-title">Personal Portfolio // Family &amp; Circle</div>
            <h2>Family and Friends</h2>
        </div>

        <!-- 2x2 Cards Grid -->
        <div class="family-grid">
            <!-- Papa's Box -->
            <div class="family-card">
                <div class="photo-wrapper">
                    <span class="role-badge">Father</span>
                    <img src="papa.jpg" alt="Me with Papa">
                </div>
                <div class="card-caption">
                    <h3>Father &amp; Son</h3>
                    <span>With My Papa</span>
                </div>
            </div>

            <!-- Mama's Box -->
            <div class="family-card">
                <div class="photo-wrapper">
                    <span class="role-badge">Mother</span>
                    <img src="mama.jpg" alt="Me with Mama">
                </div>
                <div class="card-caption">
                    <h3>Mother &amp; Son</h3>
                    <span>With My Mama</span>
                </div>
            </div>

            <!-- My Siblings Box -->
            <div class="family-card">
                <div class="photo-wrapper">
                    <span class="role-badge">Siblings</span>
                    <img src="Gemini_Generated_Image_x5w0nmx5w0nmx5w0.jpeg" alt="Me with My Siblings">
                </div>
                <div class="card-caption">
                    <h3>My Siblings</h3>
                    <span>With My Siblings</span>
                </div>
            </div>

            <!-- Friends Box -->
            <div class="family-card">
                <div class="photo-wrapper">
                    <span class="role-badge">Friends</span>
                    <img src="freinds.jpg" alt="With My Friends">
                </div>
                <div class="card-caption">
                    <h3>My Circle</h3>
                    <span>With My Friends</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>

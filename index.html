<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinlac, Marcial Jr C. - Profile</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body{
            font-family:'Montserrat',sans-serif;
            background:#173e45;
        }

        .tech-bg{
            background:#184149;
            background-image:
                radial-gradient(circle at 15% 20%,rgba(255,255,255,.05),transparent 40%),
                radial-gradient(circle at 85% 80%,rgba(0,0,0,.15),transparent 40%),
                linear-gradient(to bottom right,#1d4d57,#13343c);
            position:relative;
            overflow:hidden;
        }

        .circuit-overlay{
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            opacity:.18;
            pointer-events:none;
        }

        .photo-frame-wrapper{
            position:relative;
            padding:14px;
        }

        .photo-frame-wrapper::before{
            content:"";
            position:absolute;
            inset:0;
            border:1.5px solid rgba(255,255,255,.6);
            transition:.3s;
        }

        .photo-container:hover .photo-frame-wrapper::before{
            transform:scale(1.02);
            border-color:white;
        }

        .photo-inner-box{
            border:10px solid white;
            background:white;
            box-shadow:0 20px 35px rgba(0,0,0,.4);
        }

        .custom-underline{
            display:inline-block;
            position:relative;
        }

        .custom-underline::after{
            content:"";
            position:absolute;
            left:0;
            bottom:-8px;
            width:100%;
            height:4px;
            background:white;
        }
    </style>
</head>

<body class="min-h-screen text-white flex flex-col items-center justify-center p-6 relative">

    <!-- Navigation Menu -->
    <nav class="w-full max-w-6xl flex justify-end gap-3 font-semibold mb-6 z-20">
        <a href="index.html" class="px-4 py-2 rounded-lg bg-teal-600 text-white border border-teal-300 font-bold">
            Profile
        </a>
        <a href="about.html" class="px-4 py-2 rounded-lg bg-teal-900/60 hover:bg-teal-700 text-teal-100 transition-all">
            About Me
        </a>
        <a href="achievements.html" class="px-4 py-2 rounded-lg bg-teal-900/60 hover:bg-teal-700 text-teal-100 transition-all">
            Achievements
        </a>
        <a href="family.html" class="px-4 py-2 rounded-lg bg-teal-900/60 hover:bg-teal-700 text-teal-100 transition-all">
            Family
        </a>
    </nav>

    <main class="tech-bg w-full max-w-6xl min-h-[650px] rounded-xl shadow-2xl border border-teal-900 relative">

        <!-- Background Pattern -->
        <svg class="circuit-overlay" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
                    <circle cx="30" cy="30" r="1.5" fill="white" opacity=".4"/>
                    <path d="M60 0L0 0 0 60" stroke="white" stroke-width=".5" opacity=".15"/>
                </pattern>
            </defs>

            <rect width="100%" height="100%" fill="url(#grid)"/>

            <g stroke="white" stroke-width="1" opacity=".25">
                <path d="M50 100L150 100L200 150L200 300"/>
                <circle cx="50" cy="100" r="4" fill="white"/>
                <circle cx="200" cy="300" r="4" fill="white"/>

                <path d="M800 80L950 80L1000 130"/>
                <circle cx="800" cy="80" r="4" fill="white"/>

                <path d="M700 500L850 500L900 450L1050 450"/>
                <circle cx="700" cy="500" r="4" fill="white"/>
                <circle cx="1050" cy="450" r="4" fill="white"/>

                <path d="M100 450L250 450L300 500"/>
                <circle cx="100" cy="450" r="4" fill="white"/>
            </g>
        </svg>

        <!-- Main Layout -->
        <div class="relative z-10 grid grid-cols-1 md:grid-cols-12 items-center h-full gap-10 p-12">

            <!-- Photo -->
            <div class="md:col-span-5 flex justify-center photo-container">
                <div class="photo-frame-wrapper w-full max-w-[380px]">
                    <div class="photo-inner-box">
                        <div class="h-[430px] overflow-hidden">
                            <img src="Gemini_Generated_Image_gp00vcgp00vcgp00.jpeg" alt="Pinlac, Marcial Jr C." class="w-full h-full object-cover object-top" onerror="this.src='https://placehold.co/400x500/184149/ffffff?text=Marcial+Pinlac+Jr';">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Large Name -->
            <div class="md:col-span-7 flex items-center justify-center overflow-hidden">
                <h1 class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-extrabold leading-tight tracking-tight whitespace-nowrap">
                    <span class="custom-underline">
                        Pinlac, Marcial Jr C.
                    </span>
                </h1>
            </div>

        </div>

    </main>

</body>
</html>
